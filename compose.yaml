name: interactive-learning-platform

x-dev-service: &dev-service
  build:
    context: .
    target: dev
  working_dir: /workspace
  volumes:
    - .:/workspace
    - workspace_node_modules:/workspace/node_modules
  environment:
    CHOKIDAR_USEPOLLING: 'true'
    WATCHPACK_POLLING: 'true'
  init: true

services:
  admin-studio:
    <<: *dev-service
    command: pnpm --filter @ilp/admin-studio dev --host 0.0.0.0
    ports:
      - '${ADMIN_PORT:-5173}:5173'

  learning-workspace:
    <<: *dev-service
    command: pnpm --filter @ilp/learning-workspace dev --host 0.0.0.0
    ports:
      - '${LEARNER_PORT:-5174}:5174'

volumes:
  workspace_node_modules:
